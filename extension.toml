id = "julia"
name = "Julia"
description = "Julia support, powered by JETLS."
version = "0.2.0"
schema_version = 1
authors = [
    "Peter Pieske <piechologist@users.noreply.github.com>",
    "Shuhei Kadowaki <aviatesk@gmail.com>",
    "Paul Berg <paul@plutojl.org>",
]
repository = "https://github.com/JuliaEditorSupport/zed-julia"

# `command` stays a wildcard because the Julia executable resolves to a
# user-configurable absolute path at runtime.
[[capabilities]]
kind = "process:exec"
command = "*"
args = ["--startup-file=no", "--history-file=no", "-e", "*"]

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["--startup-file=no", "--history-file=no", "--threads=auto", "**"]

[grammars.julia]
repository = "https://github.com/tree-sitter/tree-sitter-julia"
commit = "e0f9dcd180fdcfcfa8d79a3531e11d99e79321d3"

[language_servers.JETLS]
languages = ["Julia"]
name = "JETLS.jl"
